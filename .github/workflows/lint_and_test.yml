name: Build application, run lints and tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_call:

jobs:
  laravel-tests:

    runs-on: ubuntu-latest
    permissions:
      contents: write
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: laravel_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
    - name: Cache MySQL Docker image
      id: cache-mysql
      uses: actions/cache@v3
      with:
        path: /tmp/mysql-image.tar
        key: ${{ runner.os }}-mysql-8.0

    - name: Load MySQL image from cache
      if: steps.cache-mysql.outputs.cache-hit == 'true'
      run: docker load < /tmp/mysql-image.tar

    - name: Pull and save MySQL image (if cache miss)
      if: steps.cache-mysql.outputs.cache-hit != 'true'
      run: |
        docker pull mysql:8.0
        docker save mysql:8.0 -o /tmp/mysql-image.tar

    - uses: actions/checkout@v4

    - name: Cache Composer dependencies
      uses: actions/cache@v4
      with:
        path: vendor
        key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: composer-${{ runner.os }}-

    - uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
      with:
        php-version: '8.4'

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Generate key
      run: php artisan key:generate

    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache

    - name: Run linter
      run: |
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          vendor/bin/pint --test
        else
          vendor/bin/pint
        fi

    - name: Execute tests (Unit and Feature tests) via PHPUnit/Pest
      env:
        DB_CONNECTION: mysql
        DB_USERNAME: "root"
        DB_PASSWORD: "password"
        DB_DATABASE: "laravel_test"
      run: php artisan test

    - name: Commit style fixes
      if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Apply automatic linting fixes"
        commit_user_name: "github-actions[bot]"
        commit_user_email: "github-actions[bot]@users.noreply.github.com"
